name: Bug report
description: Report a reproducible problem with the site or repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include private customer data or security-sensitive details.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page or file
      placeholder: index.html or the public page URL
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and viewport
      placeholder: Firefox 128, Windows 11, 390 x 844
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, console errors, or other non-sensitive context if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no credentials, customer data, or private vulnerability details.
          required: true
